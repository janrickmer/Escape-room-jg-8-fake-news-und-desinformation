   ============================================================ */
function translit(s){
  return (s||'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss')
    .replace(/[^a-zA-Z0-9-]/g,'');
}
// Übergibt eine Base64-PDF als generischen Binärstrom (octet-stream): Browser müssen sie speichern,
// nie anzeigen. Der Name (.pdf) kommt über das download-Attribut; die Datei bleibt eine normale PDF.
function downloadPdfBase64(b64,filename){
  const binary=atob(b64); const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const blob=new Blob([bytes],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url; link.download=filename; link.rel='noopener'; link.style.display='none';
  document.body.appendChild(link);
  link.click();   // synchron im Klick-Handler -> gilt als vom Nutzer ausgelöst
  // Link und Object-URL erst verzögert entfernen: manche Browser brechen den Download sonst ab
  setTimeout(()=>{ try{ document.body.removeChild(link); }catch(e){} URL.revokeObjectURL(url); },5000);
}
window.downloadOverviewPDF=()=>{
  try{
    const b64=generateOverviewPdf();
    const clean=(s)=>(s||'').trim().replace(/\s+/g,'-').replace(/[\/\\:*?"<>|]+/g,'');
    const vn=clean(state.firstName)||'Vorname';
    const nn=clean(state.lastName)||'Nachname';
    const filename=`Escape-Room-Überblick_von_${vn}_${nn}.pdf`;
    // Nur herunterladen, nie anzeigen: kein window.open, kein neuer Tab.
    downloadPdfBase64(b64,filename);
  }catch(e){ console.error(e); alert('Konnte die Datei „Escape-Room-Überblick" nicht erzeugen: '+e.message); }
};
window.downloadReflexionPDF=()=>{
  try{
    const b64=generateReflexionPdf();
    const name=translit(state.lastName)||'Schueler';
    downloadPdfBase64(b64,`Reflexion_${name}_${state.code}.pdf`);
  }catch(e){ console.error(e); alert('Konnte die Datei nicht erzeugen: '+e.message); }
};
window.openFeiditor=()=>{
  try{
    const tplEl=document.getElementById('feiditor-src');
    if(!tplEl){ alert('Der Feiditor konnte nicht geladen werden.'); return; }
    // Eingebetteten Feiditor-Quelltext holen und die escapten Script-End-Tags wiederherstellen
    let html=tplEl.textContent.replace(/<\\\/script>/gi,'<\/script>');
    // Escape-Room-Daten in den Feiditor injizieren: Name, die sechs Aufgaben, die roten Felder
    // und alle Daten für die Übersichts-Seiten der kombinierten PDF
    const data={
      firstName: state.firstName,
      lastName:  state.lastName,
      birthDate: state.birthDate,
      code:      state.code,
      tasks:     REFLECT_TASKS.slice(0,6),
      redFields: RED_FIELDS,
      overview:  {
        firstName:     state.firstName,
        lastName:      state.lastName,
        birthDate:     state.birthDate,
        code:          state.code,
        completedAt:   fmtDateTime(state.completedAt),
        attempts:      state.attempts,
        mistakes:      state.mistakes,
        roomLabels:    ROOM_LABELS,
        solutionNotes: SOLUTION_NOTES,
        subtitle:      PDF_SUBTITLE
      }
    };
    const inject='<script>window.__ESCAPE_DATA__='+JSON.stringify(data).replace(/</g,'\\u003c')+';<\/script>';
    // Direkt nach dem öffnenden <head> einfügen (erstes Vorkommen = echter Dokument-Head;
    // ein </head> käme auch in JS-Strings des Feiditors vor und wäre kein sicherer Anker)
    if(html.indexOf('<head>')!==-1) html=html.replace('<head>', '<head>\n'+inject);
    else html=inject+html;
    // Per document.write öffnen, damit der sichere Kontext (crypto.subtle) erhalten bleibt.
    // Ein Blob-URL würde den secure context verlieren -> Verschlüsselung schlägt fehl.
    const win=window.open('','_blank');
    if(!win){ alert('Bitte erlaube Pop-ups für diese Seite, damit sich das digitale Arbeitsblatt öffnen kann.'); return; }
    win.document.open();
    win.document.write(html);
    win.document.close();
  }catch(e){ console.error(e); alert('Das digitale Arbeitsblatt konnte nicht geöffnet werden: '+e.message); }
};

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------- Gestufte Hilfe für Lückentexte ----------
   Stufe 1–3: immer einfachere Hinweise, ab dem 4. Fehlversuch wird die Lösung genannt. */
function renderClozeHelp(containerId, blanks, wrongIds, fails){
  const box=document.getElementById(containerId); if(!box) return;
  if(!wrongIds.length){ box.className='cloze-help'; box.innerHTML=''; return; }
  const lvl=Math.min(fails,4);
  const items=blanks.filter(b=>wrongIds.includes(b.id)).map(b=>{
    const name=b.label.replace(/\s*\(.*$/,'');
    const h = lvl>=4 ? '<strong>Lösung: '+b.solution+'</strong>' : b.hints[lvl-1];
    return `<li><strong>${name}:</strong> ${h}</li>`;
  }).join('');
  box.className='cloze-help show';
  box.innerHTML=`<span class="label">Hilfe zu den Lücken · ${lvl>=4?'Lösung':'Hinweis-Stufe '+lvl+' von 3'}</span><ul>${items}</ul>`;
}

window.maskBirth=(el)=>{
  let v=el.value.replace(/[^0-9]/g,'').slice(0,8);
  let out=v;
  if(v.length>4) out=v.slice(0,2)+'.'+v.slice(2,4)+'.'+v.slice(4);
  else if(v.length>2) out=v.slice(0,2)+'.'+v.slice(2);
  el.value=out;

window.submitStart=()=>{
  const fn=document.getElementById('firstNameInput').value.trim();
  const ln=document.getElementById('lastNameInput').value.trim();
  const bd=document.getElementById('birthInput').value.trim();
  const err=document.getElementById('startError');
  function showErr(msg){ err.style.display='block'; err.textContent=msg; }
  if(fn.length<2||ln.length<2){ showErr('Bitte trag deinen vollen Vor- und Nachnamen ein (jeweils mindestens 2 Zeichen).'); return; }
  const m=bd.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if(!m){ showErr('Bitte gib dein Geburtsdatum im Format TT.MM.JJJJ ein (z. B. 07.03.2012).'); return; }
  const dd=parseInt(m[1],10), mm=parseInt(m[2],10), yyyy=parseInt(m[3],10);
  if(dd<1||dd>31||mm<1||mm>12||yyyy<1900||yyyy>2026){ showErr('Das Geburtsdatum scheint nicht zu stimmen. Bitte prüfe Tag, Monat und Jahr.'); return; }
  state.firstName=fn; state.lastName=ln; state.birthDate=bd;
  const digits=m[1]+m[2]+m[3];
  state.code=computeCode(digits);
  renderIntro();
};

      <div class="lib-section">
        <div class="lib-section-title">Der Redaktions-Blick auf @lichtenberg.leaks</div>

      </div>`,

  { id:2, location:'Redaktions-Briefing 02', name:'Warum explodiert so etwas?',
    intro:'2.847 Likes in 47 Minuten – wie kann ein erfundener Post so schnell so groß werden? Die Antwort liegt in der Technik der Plattformen und in unseren eigenen Gefühlen.',
    content:`
      <div class="lib-section">
        <div class="lib-section-title">Der Algorithmus – der unsichtbare Türsteher</div>
        <p>Auf TikTok, Instagram und Co. entscheidet nicht ein Mensch, welche Beiträge du siehst, sondern ein Computerprogramm: der <strong>Algorithmus</strong>. Er zeigt bevorzugt Beiträge, die viel <strong>Interaktion</strong> erzeugen – also Likes, Kommentare, Teilen und lange Ansichtszeiten. Und was erzeugt besonders viel Interaktion? Beiträge, die <strong>starke Gefühle</strong> auslösen: Empörung, Angst, Überraschung. So entsteht ein Kreislauf:</p>

        <p>Forscher der US-Universität <strong>MIT</strong> haben Millionen Kurznachrichten untersucht (veröffentlicht 2018 in der Fachzeitschrift <em>Science</em>). Ihr Ergebnis: <strong>Falschmeldungen erreichten 1.500 Menschen rund sechsmal schneller als wahre Meldungen</strong> und wurden deutlich häufiger weiterverbreitet. Der Grund: Falschmeldungen wirken <strong>neuer, überraschender und emotionaler</strong> – und genau das teilen Menschen am liebsten. Übrigens: Es waren vor allem echte Menschen, die die Lügen verbreiteten, nicht Maschinen.</p>

      <div class="lib-section">

            <div class="lib-card-title">Filterblase</div>

            <div class="lib-card-sub">Effekt 2</div>
            <div class="lib-card-title">Echokammer</div>

  { id:3, location:'Redaktions-Briefing 03', name:'Wem gehört die Nachricht? Der Fall NIUS',
    intro:'Eure Recherche zeigt: Der „Beweis" von @lichtenberg.leaks stammt angeblich von einer Nachrichtenseite namens „kassel-klartext.info" – ohne Impressum, ohne Namen, ohne Adresse. Zeit für die wichtigste Redaktionsfrage überhaupt: Woran erkenne ich, ob ich einer Nachrichtenseite vertrauen kann?',
    content:`
      <div class="lib-section">
        <div class="lib-section-title">Vier Fragen an jede Nachrichtenquelle</div>
        <p>Profis stellen bei jeder Quelle dieselben vier Fragen: <strong>Wer schreibt hier? Wem gehört die Seite? Wer bezahlt sie? Wer kontrolliert sie?</strong> Was passiert, wenn man diese Fragen an eine echte, viel diskutierte Nachrichtenseite stellt, siehst du jetzt an einem realen Beispiel.</p>
      </div>

      <div class="lib-section">
        <div class="lib-section-title">Das Beispiel: die Nachrichtenseite NIUS</div>
        <div class="lib-grid">
          <div class="lib-card">
            <div class="lib-card-sub">Wer schreibt hier?</div>
            <div class="lib-card-title">Chefredakteur: Julian Reichelt</div>
            <div class="lib-card-body">NIUS wurde <strong>2023</strong> gegründet. Chefredakteur ist Julian Reichelt – er war vorher Chef der „Bild"-Zeitung und musste diesen Posten <strong>2021</strong> verlassen, nachdem Vorwürfe wegen seines Verhaltens gegenüber Mitarbeiterinnen bekannt geworden waren.</div>
          </div>
          <div class="lib-card">
            <div class="lib-card-sub">Wem gehört sie? Wer bezahlt?</div>
            <div class="lib-card-title">Geldgeber: Frank Gotthardt</div>
            <div class="lib-card-body">Hinter NIUS steht der Unternehmer <strong>Frank Gotthardt</strong> (Gründer einer großen Software-Firma für Arztpraxen). Er trat zugleich als <strong>Großspender der CDU</strong> auf. Deshalb wird diskutiert: Wie unabhängig kann ein Medium von seinem Geldgeber und dessen politischen Zielen sein?</div>
          </div>
        </div>
      </div>

      <div class="lib-section">
        <div class="lib-section-title">Zwei Sichtweisen auf NIUS</div>
        <div class="persp-grid">
          <div class="persp-card">
            <div class="pc-tag">Selbstverständnis von NIUS</div>
            <h4>„Stimme der Mehrheit"</h4>
            <ul>
              <li>NIUS beschreibt sich selbst als <strong>„Stimme der Mehrheit"</strong>, die Themen anspricht, die andere Medien angeblich verschweigen.</li>
              <li>Reichelt <strong>weist den Vorwurf zurück</strong>, NIUS sei rechtspopulistisch, und sagt, die Seite mache Journalismus – nur eben „populär und emotional".</li>
            </ul>
          </div>
          <div class="persp-card crit">
            <div class="pc-tag">Kritik an NIUS</div>
            <h4>Reißerisch und teils nachweislich falsch</h4>
            <ul>
              <li>Kritiker werfen NIUS <strong>reißerische Aufmachung</strong> und <strong>irreführende Meldungen</strong> vor, die vor allem Empörung erzeugen sollen.</li>
              <li>Dokumentiert sind <strong>erfundene Zitate</strong> – unter anderem eine angebliche Entschuldigung des ukrainischen Präsidenten Selenskyj, die es nie gab. Reichelt erklärte das später mit Experimenten mit <strong>Künstlicher Intelligenz</strong>.</li>
              <li>Politikwissenschaftler <strong>warnen Politiker davor</strong>, dort aufzutreten – trotzdem geben Politiker verschiedener Parteien der Seite Interviews.</li>
            </ul>
          </div>
        </div>
      </div>

      <div class="lib-section">
        <div class="lib-section-title">Wer kontrolliert eigentlich Medien in Deutschland?</div>
        <div class="lib-grid">
          <div class="lib-card">
            <div class="lib-card-sub">Weg 1 · freiwillig</div>
            <div class="lib-card-title">Der Deutsche Presserat</div>
            <div class="lib-card-body">Die <strong>freiwillige Selbstkontrolle</strong> der Presse. Zeitungen und Portale, die mitmachen, verpflichten sich auf den <strong>Pressekodex</strong> (z. B. Wahrheitspflicht, Sorgfalt). Bei Verstößen kann der Presserat öffentliche <strong>Rügen</strong> aussprechen. <strong>Aber: NIUS macht dabei nicht mit</strong> – deshalb kann der Presserat NIUS gar nicht rügen.</div>
          </div>
          <div class="lib-card">
            <div class="lib-card-sub">Weg 2 · Aufsicht</div>
            <div class="lib-card-title">Die Landesmedienanstalt</div>
            <div class="lib-card-body">Für Online-Medien wie NIUS ist eine <strong>staatsferne Aufsichtsbehörde</strong> zuständig: die <strong>Medienanstalt Berlin-Brandenburg</strong>. Sie prüft nach mehreren Beschwerden, ob NIUS gegen die <strong>journalistische Sorgfaltspflicht</strong> verstößt, und hat die Seite bereits <strong>beanstandet</strong>. NIUS wehrt sich dagegen vor Gericht.</div>
          </div>
        </div>
      </div>

      <div class="note-box">
        <span class="note-label">Merksatz der Redaktion</span>
        Prüfe bei jeder Nachrichtenseite: <strong>Wer schreibt? Wem gehört sie? Wer bezahlt? Wer kontrolliert?</strong> Ob du ein Medium am Ende gut findest, entscheidest du selbst – diese vier Fragen gelten für <strong>jede</strong> Quelle, egal welcher politischen Richtung. Und eine Seite ganz ohne Impressum wie „kassel-klartext.info"? Fällt schon bei Frage 1 durch.
      </div>`,
    target:'Beweisstück 03', video:'Q7dXrY3xU-k' },

    intro:'Nächster Fund der Redaktion: Der „Beweis-Screenshot" von @lichtenberg.leaks sieht aus wie eine bekannte Nachrichtenseite – aber die Internetadresse endet falsch. Genau dieser Trick wird in Wirklichkeit im ganz großen Stil eingesetzt: von einer Kampagne, die aus Russland gesteuert wird.',

function triggerReveal(roomIdx){
  state.solved[roomIdx]=true; state.letters[roomIdx]=CODE_WORD[roomIdx];
  const overlay=document.getElementById('revealOverlay');
  document.getElementById('revealLetter').textContent=CODE_WORD[roomIdx];
  document.getElementById('revealCaption').textContent=`Beweisstück ${roomIdx+1} von 5 gesichert · Buchstabe freigeschaltet`;
  const progBox=document.getElementById('revealProgress'); progBox.innerHTML='';
  for(let i=0;i<5;i++){ const span=document.createElement('span'); span.className='reveal-progress-letter'+(state.solved[i]?' lit':''); span.textContent=state.solved[i]?CODE_WORD[i]:'·'; progBox.appendChild(span); }
  const btn=document.getElementById('revealContinue'); const isLast=roomIdx===4;
  btn.textContent=isLast?'Fall abschließen':'Nächstes Redaktions-Briefing öffnen';
  btn.onclick=()=>{ overlay.classList.remove('show'); setTimeout(()=>{ if(isLast) renderFinal(); else goLibrary(roomIdx+2); },250); };
  overlay.classList.add('show');
}
